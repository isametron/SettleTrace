# Streamlit's own chrome (widgets, sidebar, expanders) is themed here so it
# matches the chart palette in dashboard/app.py rather than fighting it.
# Values are the light steps from the project's validated reference palette.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f4f4f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
